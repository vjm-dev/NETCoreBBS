services:
  netcorebbs:
    image: ${DOCKER_REGISTRY-}netcorebbs
    build:
      context: .
      dockerfile: src/NetCoreBBS/Dockerfile
    ports:
      - "80:8080"
    depends_on:
      - postgres
    links:
      - postgres:postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=netcorebbs;Username=postgresadmin;Password=my_password;Port=5432
    networks:
      - bbs-network

  postgres:
    image: postgres:15
    container_name: postgres-bbs
    environment:
      POSTGRES_DB: netcorebbs
      POSTGRES_USER: postgresadmin
      POSTGRES_PASSWORD: my_password
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - bbs-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-bbs
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bbs.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    networks:
      - bbs-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bbs-network:
    driver: bridge